# ============================================================
# SecDocs Auto-Update Pipeline
# Generated by the sec-docs skill on {GENERATED_DATE}
#
# WHAT THIS PIPELINE DOES:
#   1. Checks out this (docs workspace) repo and all source repos
#   2. Authenticates to Azure via a service connection (for Graph API access)
#   3. Runs Invoke-EntraIDAudit.ps1 to audit Entra ID app registrations
#   4. Runs the sec-docs GitHub Copilot skill (--update mode)
#   5. Commits and pushes updated docs/sec-docs/ to this repo
#
# SETUP STEPS:
# 1. Copy this file to your docs workspace repository root and rename it
#    (e.g. sec-docs-pipeline.yml)
# 2. In Azure DevOps: Pipelines → New pipeline → Azure Repos Git →
#    select this repository → Existing Azure Pipelines YAML file →
#    point to the file you copied in step 1
# 3. Create a variable group named "sec-docs-secrets":
#    Library → Variable groups → New variable group
#    Add variable: GH_TOKEN (mark as secret) = a GitHub fine-grained PAT
#    with "Copilot Requests" permission enabled
# 4. Create an Azure service connection named "sec-docs-azure":
#    Project Settings → Service connections → New service connection →
#    Azure Resource Manager → Service principal (automatic or manual) →
#    Scope: subscription (read-only) — a Global Reader / Security Reader
#    principal is sufficient. Name it "sec-docs-azure".
# 5. In the pipeline, go to Edit → Variables → Variable groups →
#    link the "sec-docs-secrets" group
# 6. Grant the build service account "Contribute" permission on this
#    repository (Project Settings → Repositories → {repo} → Security)
# 7. For each sub-repository listed in resources.repositories below,
#    grant the build service account "Read" permission
# ============================================================

name: SecDocs Biweekly Security Analysis

trigger: none   # only runs on schedule or manual trigger

schedules:
- cron: "0 3 1,15 * *"    # 1st and 15th of every month at 03:00 UTC
  displayName: Biweekly SecDocs Security Analysis
  branches:
    include:
    - main
  always: true             # run even when no new commits in this repo

pool:
  vmImage: ubuntu-latest

variables:
- group: sec-docs-secrets   # must contain GH_TOKEN (secret)
- name: docsRepo
  value: "{DOCS_REPO_NAME}"  # directory name of the docs/wiki workspace repo

resources:
  repositories:
  - repository: {REPO_1_ALIAS}
    type: git
    name: $(System.TeamProject)/{REPO_1_NAME}
  - repository: {REPO_2_ALIAS}
    type: git
    name: $(System.TeamProject)/{REPO_2_NAME}
  # Additional repository entries are generated here for each extra repo

steps:

# ── Checkout ────────────────────────────────────────────────────────────────

- checkout: self
  path: s/$(docsRepo)
  persistCredentials: true
  displayName: "Checkout docs workspace"

- checkout: {REPO_1_ALIAS}
  path: s/$(docsRepo)/{REPO_1_NAME}
  displayName: "Checkout {REPO_1_NAME}"

- checkout: {REPO_2_ALIAS}
  path: s/$(docsRepo)/{REPO_2_NAME}
  displayName: "Checkout {REPO_2_NAME}"

# Additional checkout steps are generated here for each extra repo

# ── Install PowerShell 7 (if not already present) ────────────────────────────

- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: "8.x"
  displayName: "Install .NET SDK (required for pwsh 7)"
  condition: eq(variables['Agent.OS'], 'Linux')

# ── Entra ID Audit (uses Azure CLI service connection for Graph token) ────────
#
# The orchestrator at docs/sec-docs/reports/entraid/Invoke-EntraIDAudit.ps1 is
# generated and maintained by the sec-docs skill. Its manifest block lists the
# project's tenant + deployable units + app registrations. If you add a new unit
# or environment, run /sec-docs locally to refresh the manifest, then commit the
# updated orchestrator.
#
# Utility scripts under .claude/skills/sec-docs/references/entraid/ are part of
# the skill definition and must not be edited by hand.

- task: AzureCLI@2
  displayName: "Run Entra ID ASVS Audit"
  inputs:
    azureSubscription: "sec-docs-azure"   # service connection name from Setup Step 4
    scriptType: pscore
    scriptLocation: scriptPath
    scriptPath: "$(Pipeline.Workspace)/s/$(docsRepo)/docs/sec-docs/reports/entraid/Invoke-EntraIDAudit.ps1"
    arguments: >
      -RepoRoots
      "$(Pipeline.Workspace)/s/$(docsRepo)/{REPO_1_NAME}",
      "$(Pipeline.Workspace)/s/$(docsRepo)/{REPO_2_NAME}"
      -OutputDir "$(Pipeline.Workspace)/s/$(docsRepo)/docs/sec-docs/reports/entraid"
    powerShellErrorActionPreference: continue
  env:
    # Azure CLI is already authenticated by the AzureCLI@2 task via the service connection.
    # No additional env vars needed for az account get-access-token to work.
    AZURE_CORE_OUTPUT: json

# ── Install GitHub Copilot CLI ───────────────────────────────────────────────

- task: NodeTool@0
  inputs:
    versionSpec: "20.x"
  displayName: "Install Node.js"

- script: npm install -g @github/copilot
  displayName: "Install GitHub Copilot CLI"

- script: |
    git config user.email "sec-docs@company.com"
    git config user.name "Sec Docs Bot"
  workingDirectory: $(Pipeline.Workspace)/s/$(docsRepo)
  displayName: "Configure git author"

# ── Run SecDocs skill ────────────────────────────────────────────────────────

- script: |
    copilot --allow-all --prompt "/sec-docs --update"
  workingDirectory: $(Pipeline.Workspace)/s/$(docsRepo)
  displayName: "Run sec-docs skill (incremental update)"
  env:
    GH_TOKEN: $(GH_TOKEN)

# ── Push sec-docs changes ────────────────────────────────────────────────────

- script: |
    git push origin HEAD:$(Build.SourceBranchName)
  workingDirectory: $(Pipeline.Workspace)/s/$(docsRepo)
  displayName: "Push sec-docs changes"
